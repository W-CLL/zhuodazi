name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Run Windows checks
        shell: pwsh
        run: dotnet run --project windows/tests/GifLibraryService.Checks/GifLibraryService.Checks.csproj --configuration Release

      - name: Read application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content windows/ZhuoDazi/ZhuoDazi.csproj
          "APP_VERSION=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./windows/scripts/build-native.ps1 -Version $env:APP_VERSION

      - name: Smoke test installed application
        shell: pwsh
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP "ZhuoDazi-install-smoke"
          $installer = Resolve-Path "windows/dist/ZhuoDazi-Desktop-Pet-$env:APP_VERSION.exe"
          $installProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDirectory", "/MERGETASKS=!desktopicon" `
            -PassThru
          $installProcess.WaitForExit()

          if ($installProcess.ExitCode -ne 0) {
            throw "Installer failed with exit code $($installProcess.ExitCode)"
          }

          Start-Sleep -Seconds 3
          $launchedApplication = Get-Process -Name "ZhuoDazi" -ErrorAction SilentlyContinue
          if (-not $launchedApplication) {
            throw "Silent installer did not restart the application"
          }
          $launchedApplication | Stop-Process -Force

          $application = Join-Path $installDirectory "app/ZhuoDazi.exe"
          if (-not (Test-Path -LiteralPath $application)) {
            throw "Installed application was not found at $application"
          }

          $unexpectedEntries = Get-ChildItem -LiteralPath $installDirectory -Force |
            Where-Object { $_.Name -notin @("app", "uninstall") }
          if ($unexpectedEntries) {
            $names = ($unexpectedEntries.Name | Sort-Object) -join ", "
            throw "Unexpected entries in the installation root: $names"
          }

          $process = Start-Process -FilePath $application -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited -and $process.ExitCode -ne 0) {
            $hexExitCode = "{0:X8}" -f ($process.ExitCode -band 0xffffffff)
            throw "Installed application exited during startup: $($process.ExitCode) / 0x$hexExitCode"
          }

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

      - name: Smoke test published application
        shell: pwsh
        run: |
          $application = Resolve-Path "windows/publish/win-x64/ZhuoDazi.exe"
          $process = Start-Process -FilePath $application -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $process.Refresh()

          if ($process.HasExited -and $process.ExitCode -ne 0) {
            $hexExitCode = "{0:X8}" -f ($process.ExitCode -band 0xffffffff)
            throw "Published application exited during startup: $($process.ExitCode) / 0x$hexExitCode"
          }

          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

      - name: Build portable archive
        shell: pwsh
        run: |
          $archive = "windows/dist/ZhuoDazi-Desktop-Pet-$env:APP_VERSION-portable.zip"
          Compress-Archive -Path "windows/publish/win-x64/*" -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Upload Windows packages to unified draft release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:APP_VERSION"
          $assets = @(
            "windows/dist/ZhuoDazi-Desktop-Pet-$env:APP_VERSION.exe"
            "windows/dist/ZhuoDazi-Desktop-Pet-$env:APP_VERSION-portable.zip"
          )
          gh release upload $tag $assets --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload Windows packages to draft release $tag."
          }
