name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test GIF randomization
        shell: pwsh
        run: dotnet run --project windows/tests/GifLibraryService.Checks/GifLibraryService.Checks.csproj --configuration Release

      - name: Read application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content windows/ZhuoDazi/ZhuoDazi.csproj
          "APP_VERSION=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./windows/scripts/build-native.ps1 -Version $env:APP_VERSION

      - name: Build portable archive
        shell: pwsh
        run: |
          $archive = "windows/dist/ZhuoDazi-Desktop-Pet-$env:APP_VERSION-portable.zip"
          Compress-Archive -Path "windows/publish/win-x64/*" -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ZhuoDazi-Windows-Installer-${{ env.APP_VERSION }}
          path: windows/dist/ZhuoDazi-Desktop-Pet-${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v7
        with:
          name: ZhuoDazi-Windows-Portable-${{ env.APP_VERSION }}
          path: windows/dist/ZhuoDazi-Desktop-Pet-${{ env.APP_VERSION }}-portable.zip
          if-no-files-found: error
          retention-days: 14
