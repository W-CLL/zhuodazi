name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content windows/ZhuoDazi/ZhuoDazi.csproj
          "APP_VERSION=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./windows/scripts/build-native.ps1 -Version $env:APP_VERSION

      - name: Build portable archive
        shell: pwsh
        run: |
          $archive = "windows/dist/ZhuoDazi-Desktop-Pet-$env:APP_VERSION-portable.zip"
          Compress-Archive -Path "windows/publish/win-x64/*" -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ZhuoDazi-Windows-${{ env.APP_VERSION }}
          path: windows/dist/*
          if-no-files-found: error
          retention-days: 14
