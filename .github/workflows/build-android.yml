name: Build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "macos/Resources/Pets/**"
      - "content-packs/互动词包/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "macos/Resources/Pets/**"
      - "content-packs/互动词包/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Install Android SDK packages
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Lint and build debug APK
        run: gradle --project-dir android :app:lintDebug :app:assembleDebug --stacktrace

      - name: Prepare package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZhuoDazi-Android-1.0.0-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: ZhuoDazi-Android-1.0.0-debug
          path: ZhuoDazi-Android-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 14
