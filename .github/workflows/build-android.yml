name: Build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "mobile_ui/**"
      - "macos/Resources/Pets/**"
      - "content-packs/互动词包/**"
      - "content-packs/小剧场/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "mobile_ui/**"
      - "macos/Resources/Pets/**"
      - "content-packs/互动词包/**"
      - "content-packs/小剧场/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Prepare Flutter module
        working-directory: mobile_ui
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platform-tools"

      - name: Prepare stable Android signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zhuodazi-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zhuodazi-release.jks" >> "$GITHUB_ENV"

      - name: Lint and build APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle --project-dir android :app:lintDebug :app:assembleDebug --no-configuration-cache --stacktrace
            echo "APK_DIR=android/app/build/outputs/apk/debug" >> "$GITHUB_ENV"
          else
            gradle --project-dir android :app:lintRelease :app:assembleRelease --no-configuration-cache --stacktrace
            echo "APK_DIR=android/app/build/outputs/apk/release" >> "$GITHUB_ENV"
          fi

      - name: Verify APK signature
        run: |
          mapfile -t apks < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
              --verbose \
              --print-certs \
              "$apk"
          done

      - name: Prepare package
        if: github.event_name != 'pull_request'
        run: |
          cp "$APK_DIR/app-arm64-v8a-release.apk" ZhuoDazi-Android-1.3.1-arm64.apk
          cp "$APK_DIR/app-armeabi-v7a-release.apk" ZhuoDazi-Android-1.3.1-armv7.apk

      - name: Upload APK to Android draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-v1.3.1"
          asset_arm64="ZhuoDazi-Android-1.3.1-arm64.apk"
          asset_armv7="ZhuoDazi-Android-1.3.1-armv7.apk"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "桌搭子 Android v1.3.1" \
              --notes "Android 试用版 1.3.1：体验期内系统会本地演示一次来访。ARM64 适用于绝大多数手机，ARMv7 仅用于较旧的 32 位设备。安装后需授予显示在其他应用上层权限。"
          fi
          gh release upload "$tag" "$asset_arm64" "$asset_armv7" --clobber
          gh release delete-asset "$tag" "ZhuoDazi-Android-1.3.1.apk" --yes || true
          gh release delete-asset "$tag" "ZhuoDazi-Android-1.3.1-debug.apk" --yes || true
