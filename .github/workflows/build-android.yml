name: Build Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "macos/Resources/Pets/**"
      - "content-packs/互动词包/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "macos/Resources/Pets/**"
      - "content-packs/互动词包/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Lint and build debug APK
        run: gradle --project-dir android :app:lintDebug :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZhuoDazi-Android-1.1.0-debug.apk

      - name: Upload APK to Android draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-v1.1.0"
          asset="ZhuoDazi-Android-1.1.0-debug.apk"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "桌搭子 Android v1.1.0" \
              --notes "Android 功能预览版：五栏应用界面、悬浮桌宠快捷菜单、真实触摸穿透、隐藏保活、独立设备激活与体验、搭子配对和桌宠互发。安装后需授予显示在其他应用上层权限。"
          fi
          gh release upload "$tag" "$asset" --clobber
