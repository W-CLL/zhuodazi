name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "mobile_ui/**"
      - "macos/Resources/Pets/**"
      - "content-packs/互动词包/**"
      - "content-packs/小剧场/**"
      - "scripts/check-release-consistency.py"
      - "docs/releases/android-*.md"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "mobile_ui/**"
      - "macos/Resources/Pets/**"
      - "content-packs/互动词包/**"
      - "content-packs/小剧场/**"
      - "scripts/check-release-consistency.py"
      - "docs/releases/android-*.md"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Check platform version metadata
        run: python3 scripts/check-release-consistency.py

      - name: Read Android version
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path

          configuration = Path("android/app/build.gradle.kts").read_text(encoding="utf-8")
          version_match = re.search(r'^\s*versionName\s*=\s*"(\d+\.\d+\.\d+)"\s*$', configuration, re.MULTILINE)
          code_match = re.search(r'^\s*versionCode\s*=\s*([1-9]\d*)\s*$', configuration, re.MULTILINE)
          if not version_match or not code_match:
              raise SystemExit("Android requires a MAJOR.MINOR.PATCH versionName and a positive versionCode.")
          print(f"APP_VERSION={version_match.group(1)}")
          print(f"APP_VERSION_CODE={code_match.group(1)}")
          PY

      - name: Reject published Android version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-v${APP_VERSION}"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$state" == "false" ]]; then
            echo "Release $tag is already published; bump versionName and versionCode before rebuilding." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Prepare Flutter module
        working-directory: mobile_ui
        run: flutter pub get

      - name: Check Flutter UI
        working-directory: mobile_ui
        run: |
          flutter analyze
          flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"
          cache-provider: basic

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platform-tools"

      - name: Prepare stable Android signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zhuodazi-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/zhuodazi-release.jks" >> "$GITHUB_ENV"

      - name: Test native interaction lifecycle
        run: gradle --project-dir android :app:testDebugUnitTest --no-configuration-cache --stacktrace

      - name: Lint and build APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle --project-dir android :app:lintDebug :app:assembleDebug --no-configuration-cache --stacktrace
            echo "APK_DIR=android/app/build/outputs/apk/debug" >> "$GITHUB_ENV"
          else
            gradle --project-dir android :app:lintRelease :app:assembleRelease --no-configuration-cache --stacktrace
            echo "APK_DIR=android/app/build/outputs/apk/release" >> "$GITHUB_ENV"
          fi

      - name: Verify APK signature
        run: |
          mapfile -t apks < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
              --verbose \
              --print-certs \
              "$apk"
          done

      - name: Prepare package
        if: github.event_name != 'pull_request'
        run: |
          cp "$APK_DIR/app-arm64-v8a-release.apk" "ZhuoDazi-Android-${APP_VERSION}-arm64.apk"
          cp "$APK_DIR/app-armeabi-v7a-release.apk" "ZhuoDazi-Android-${APP_VERSION}-armv7.apk"

      - name: Check packaged version and dialogue assets
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import os, re, subprocess, zipfile
          from pathlib import Path

          aapt = Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0/aapt"
          sources = {file.name: file.read_bytes() for file in Path("content-packs/互动词包").glob("*.json")}
          assert sources, "No bundled dialogue packs"
          for apk in sorted(Path(os.environ["APK_DIR"]).glob("*.apk")):
              metadata = subprocess.check_output([str(aapt), "dump", "badging", str(apk)], text=True)
              package = next(line for line in metadata.splitlines() if line.startswith("package:"))
              fields = dict(re.findall(r"(\w+)='([^']*)'", package))
              assert fields["name"] == "com.zhuodazi.android", package
              assert fields["versionName"] == os.environ["APP_VERSION"], package
              assert fields["versionCode"] == os.environ["APP_VERSION_CODE"], package
              with zipfile.ZipFile(apk) as archive:
                  # Android reads UTF-8 names even when ZIP writers omit its flag.
                  entries = {
                      (entry.filename if entry.flag_bits & 0x800 else entry.filename.encode("cp437").decode("utf-8")): entry
                      for entry in archive.infolist()
                  }
                  names = set(entries)
                  expected = {f"assets/word-packs/{name}" for name in sources}
                  actual = {name for name in names if name.startswith("assets/word-packs/") and not name.endswith("/")}
                  assert actual == expected, (actual, expected)
                  for name, content in sources.items():
                      assert archive.read(entries[f"assets/word-packs/{name}"]) == content, name
                      assert f"assets/{name}" not in names, "Dialogue still present at asset root"
                  assert archive.read(entries["assets/interaction_fallback.json"]), "Missing offline interaction content"
              print(f"{apk.name}: {fields['versionName']}+{fields['versionCode']}, {len(sources)} dialogue packs verified")
          PY

      - name: Upload APK to Android draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="android-v${APP_VERSION}"
          title="桌搭子 Android v${APP_VERSION}"
          notes_file="docs/releases/android-${APP_VERSION}.md"
          asset_arm64="ZhuoDazi-Android-${APP_VERSION}-arm64.apk"
          asset_armv7="ZhuoDazi-Android-${APP_VERSION}-armv7.apk"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$state" == "false" ]]; then
            echo "Release $tag is already published; refusing to overwrite its packages." >&2
            exit 1
          fi
          if [[ -z "$state" ]]; then
            test -s "$notes_file" || { echo "请先编写面向用户的更新说明：$notes_file" >&2; exit 1; }
            gh release create "$tag" \
              --draft \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file"
          else
            test -s "$notes_file" || { echo "请先编写面向用户的更新说明：$notes_file" >&2; exit 1; }
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes_file"
          fi
          gh release upload "$tag" "$asset_arm64" "$asset_armv7" --clobber
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true"
