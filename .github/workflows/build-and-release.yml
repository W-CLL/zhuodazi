name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "macos/**"
      - ".github/workflows/**"
      - "scripts/prepare-desktop-releases.py"
      - "scripts/tests/**"
  pull_request:
    paths:
      - "windows/**"
      - "macos/**"
      - ".github/workflows/**"
      - "scripts/prepare-desktop-releases.py"
      - "scripts/tests/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Read release metadata
    runs-on: ubuntu-latest
    outputs:
      windows_version: ${{ steps.version.outputs.windows }}
      macos_version: ${{ steps.version.outputs.macos }}
    steps:
      - uses: actions/checkout@v7

      - name: Test independent platform releases
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Read application version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import plistlib
          import re
          import xml.etree.ElementTree as ET

          project = ET.parse("windows/ZhuoDazi/ZhuoDazi.csproj").getroot()
          windows_version = project.findtext("./PropertyGroup/Version", "").strip()
          windows_file_version = project.findtext("./PropertyGroup/FileVersion", "").strip()
          with open("macos/Info.plist", "rb") as stream:
              macos_metadata = plistlib.load(stream)
          macos_version = str(macos_metadata.get("CFBundleShortVersionString", "")).strip()
          macos_build_version = str(macos_metadata.get("CFBundleVersion", "")).strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+", windows_version):
              raise SystemExit(f"Version must use MAJOR.MINOR.PATCH format, received {windows_version!r}.")
          if not re.fullmatch(r"\d+\.\d+\.\d+", macos_version):
              raise SystemExit(f"Version must use MAJOR.MINOR.PATCH format, received {macos_version!r}.")
          if windows_file_version != f"{windows_version}.0":
              raise SystemExit(f"Windows file version must be {windows_version}.0, received {windows_file_version!r}.")
          if macos_build_version != macos_version:
              raise SystemExit(f"macOS build version must be {macos_version}, received {macos_build_version!r}.")
          print(f"windows={windows_version}")
          print(f"macos={macos_version}")
          PY

  prepare-release:
    name: Prepare platform draft releases
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      windows_published: ${{ steps.release.outputs.windows_published }}
      macos_published: ${{ steps.release.outputs.macos_published }}
      macos_tag: ${{ steps.release.outputs.macos_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or update platform draft releases
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WINDOWS_VERSION: ${{ needs.metadata.outputs.windows_version }}
          MACOS_VERSION: ${{ needs.metadata.outputs.macos_version }}
          TARGET_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-desktop-releases.py

  build-windows:
    name: Build Windows
    needs: [metadata, prepare-release]
    if: needs.prepare-release.outputs.windows_published != 'true'
    uses: ./.github/workflows/build-windows.yml

  build-macos:
    name: Build macOS
    needs: [metadata, prepare-release]
    if: needs.prepare-release.outputs.macos_published != 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      release_tag: ${{ needs.prepare-release.outputs.macos_tag }}

  verify-release:
    name: Verify platform draft releases
    if: always() && !cancelled() && github.event_name != 'pull_request' && needs.prepare-release.result == 'success'
    needs: [metadata, prepare-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check Windows packages
        if: needs.prepare-release.outputs.windows_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.metadata.outputs.windows_version }}
        run: |
          tag="v${APP_VERSION}"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for expected in \
            "ZhuoDazi-Desktop-Pet-${APP_VERSION}.exe" \
            "ZhuoDazi-Desktop-Pet-${APP_VERSION}-portable.zip"
          do
            grep -Fx "$expected" <<< "$assets" >/dev/null || {
              echo "Missing release asset: $expected" >&2
              exit 1
            }
          done

      - name: Check macOS packages
        if: needs.prepare-release.outputs.macos_published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.metadata.outputs.macos_version }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.macos_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for expected in \
            "ZhuoDazi-macOS-${APP_VERSION}-arm64.zip" \
            "ZhuoDazi-macOS-${APP_VERSION}-x86_64.zip"
          do
            grep -Fx "$expected" <<< "$assets" >/dev/null || {
              echo "Missing macOS asset: $expected" >&2
              exit 1
            }
          done
