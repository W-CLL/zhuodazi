name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "macos/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "windows/**"
      - "macos/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Read release metadata
    runs-on: ubuntu-latest
    outputs:
      windows_version: ${{ steps.version.outputs.windows }}
      macos_version: ${{ steps.version.outputs.macos }}
    steps:
      - uses: actions/checkout@v7

      - name: Read application version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import plistlib
          import re
          import xml.etree.ElementTree as ET

          project = ET.parse("windows/ZhuoDazi/ZhuoDazi.csproj").getroot()
          windows_version = project.findtext("./PropertyGroup/Version", "").strip()
          windows_file_version = project.findtext("./PropertyGroup/FileVersion", "").strip()
          with open("macos/Info.plist", "rb") as stream:
              macos_metadata = plistlib.load(stream)
          macos_version = str(macos_metadata.get("CFBundleShortVersionString", "")).strip()
          macos_build_version = str(macos_metadata.get("CFBundleVersion", "")).strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+", windows_version):
              raise SystemExit(f"Version must use MAJOR.MINOR.PATCH format, received {windows_version!r}.")
          if not re.fullmatch(r"\d+\.\d+\.\d+", macos_version):
              raise SystemExit(f"Version must use MAJOR.MINOR.PATCH format, received {macos_version!r}.")
          if windows_file_version != f"{windows_version}.0":
              raise SystemExit(f"Windows file version must be {windows_version}.0, received {windows_file_version!r}.")
          if macos_build_version != macos_version:
              raise SystemExit(f"macOS build version must be {macos_version}, received {macos_build_version!r}.")
          print(f"windows={windows_version}")
          print(f"macos={macos_version}")
          PY

  build-windows:
    name: Build Windows
    needs: metadata
    uses: ./.github/workflows/build-windows.yml

  build-macos:
    name: Build macOS
    needs: metadata
    uses: ./.github/workflows/build-macos.yml

  release:
    name: Create draft release
    if: github.event_name != 'pull_request'
    needs: [metadata, build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      WINDOWS_VERSION: ${{ needs.metadata.outputs.windows_version }}
      MACOS_VERSION: ${{ needs.metadata.outputs.macos_version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create or update platform draft releases
        run: |
          mapfile -t windows_assets < <(find release-assets -type f -name 'ZhuoDazi-Desktop-Pet-*' -print | sort)
          mapfile -t macos_assets < <(find release-assets -type f -name 'ZhuoDazi-macOS-*' -print | sort)
          if (( ${#windows_assets[@]} != 2 || ${#macos_assets[@]} != 2 )); then
            echo "Expected two Windows and two macOS assets." >&2
            exit 1
          fi

          publish_draft() {
            local tag="$1" title="$2" notes="$3"
            shift 3
            local existing_state
            existing_state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [[ "$existing_state" == "false" ]]; then
              echo "Release $tag is already published; leaving it unchanged."
            elif [[ "$existing_state" == "true" ]]; then
              gh release upload "$tag" "$@" --clobber
              gh release edit "$tag" --target "$GITHUB_SHA" --title "$title" --notes "$notes"
            else
              gh release create "$tag" "$@" --draft --target "$GITHUB_SHA" --title "$title" --notes "$notes"
            fi
          }

          publish_draft "v${WINDOWS_VERSION}" "ZhuoDazi Windows ${WINDOWS_VERSION}" \
            "Windows release. Source commit: ${GITHUB_SHA}" "${windows_assets[@]}"
          publish_draft "macos-v${MACOS_VERSION}" "ZhuoDazi macOS ${MACOS_VERSION}" \
            "macOS release. Ad-hoc signed and not notarized. Source commit: ${GITHUB_SHA}" "${macos_assets[@]}"
