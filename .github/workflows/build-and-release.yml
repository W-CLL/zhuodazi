name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "macos/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "windows/**"
      - "macos/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Read release metadata
    runs-on: ubuntu-latest
    outputs:
      windows_version: ${{ steps.version.outputs.windows }}
      macos_version: ${{ steps.version.outputs.macos }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read application version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import plistlib
          import re
          import xml.etree.ElementTree as ET

          project = ET.parse("windows/ZhuoDazi/ZhuoDazi.csproj").getroot()
          windows_version = project.findtext("./PropertyGroup/Version", "").strip()
          windows_file_version = project.findtext("./PropertyGroup/FileVersion", "").strip()
          with open("macos/Info.plist", "rb") as stream:
              macos_metadata = plistlib.load(stream)
          macos_version = str(macos_metadata.get("CFBundleShortVersionString", "")).strip()
          macos_build_version = str(macos_metadata.get("CFBundleVersion", "")).strip()

          if not re.fullmatch(r"\d+\.\d+\.\d+", windows_version):
              raise SystemExit(f"Version must use MAJOR.MINOR.PATCH format, received {windows_version!r}.")
          if not re.fullmatch(r"\d+\.\d+\.\d+", macos_version):
              raise SystemExit(f"Version must use MAJOR.MINOR.PATCH format, received {macos_version!r}.")
          if windows_file_version != f"{windows_version}.0":
              raise SystemExit(f"Windows file version must be {windows_version}.0, received {windows_file_version!r}.")
          if macos_build_version != macos_version:
              raise SystemExit(f"macOS build version must be {macos_version}, received {macos_build_version!r}.")
          if windows_version != macos_version:
              raise SystemExit(f"Windows and macOS versions must match: {windows_version} != {macos_version}.")
          print(f"windows={windows_version}")
          print(f"macos={macos_version}")
          print(f"version={windows_version}")
          PY

  prepare-release:
    name: Prepare unified draft release
    needs: metadata
    runs-on: ubuntu-latest
    outputs:
      release_published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or update draft release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.metadata.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          tag="v${APP_VERSION}"
          title="桌搭子 ${APP_VERSION}"
          notes="$(cat <<EOF
          ${APP_VERSION}：搭子 GIF 来访作为独立互动出现，不会替换原桌宠。

          本 Release 同时包含 Windows x64 安装包、Windows 便携包、macOS Apple 芯片包和 macOS Intel 芯片包。
          EOF
          )"
          state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$state" == "false" ]]; then
            application_changes="$(git diff --name-only "$tag" "$TARGET_SHA" -- windows macos)"
            if [[ -n "$application_changes" ]]; then
              echo "Release $tag is already published and application files changed; bump the version before rebuilding." >&2
              echo "$application_changes" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already contains the same application code; skipping duplicate packages."
            exit 0
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"
          if [[ -z "$state" ]]; then
            gh release create "$tag" --draft --target "$TARGET_SHA" --title "$title" --notes "$notes"
          else
            gh release edit "$tag" --target "$TARGET_SHA" --title "$title" --notes "$notes"
          fi

  build-windows:
    name: Build Windows
    needs: [metadata, prepare-release]
    if: needs.prepare-release.outputs.release_published != 'true'
    uses: ./.github/workflows/build-windows.yml

  build-macos:
    name: Build macOS
    needs: [metadata, prepare-release]
    if: needs.prepare-release.outputs.release_published != 'true'
    uses: ./.github/workflows/build-macos.yml

  verify-release:
    name: Verify unified draft release
    if: github.event_name != 'pull_request' && needs.prepare-release.outputs.release_published != 'true'
    needs: [metadata, prepare-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check all platform packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          tag="v${APP_VERSION}"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for expected in \
            "ZhuoDazi-Desktop-Pet-${APP_VERSION}.exe" \
            "ZhuoDazi-Desktop-Pet-${APP_VERSION}-portable.zip" \
            "ZhuoDazi-macOS-${APP_VERSION}-arm64.zip" \
            "ZhuoDazi-macOS-${APP_VERSION}-x86_64.zip"
          do
            grep -Fx "$expected" <<< "$assets" >/dev/null || {
              echo "Missing release asset: $expected" >&2
              exit 1
            }
          done
