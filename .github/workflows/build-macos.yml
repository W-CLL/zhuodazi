name: Build macOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test macOS core logic
        run: swift test --package-path macos

      - name: Read application version
        run: echo "APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)" >> "$GITHUB_ENV"

      - name: Build ad-hoc signed application
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          ARCH_LABEL: ${{ matrix.arch }}
        run: bash macos/scripts/build-app.sh

      - name: Verify package architecture
        run: |
          file "macos/dist/ZhuoDazi-macOS-${APP_VERSION}-${{ matrix.arch }}.app/Contents/MacOS/ZhuoDazi"
          codesign --verify --deep --strict "macos/dist/ZhuoDazi-macOS-${APP_VERSION}-${{ matrix.arch }}.app"

      - name: Upload macOS build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZhuoDazi-macOS-${{ env.APP_VERSION }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: macos/dist/ZhuoDazi-macOS-${{ env.APP_VERSION }}-${{ matrix.arch }}.zip

      - name: Upload macOS package to draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="macos-v${APP_VERSION}"
          title="ZhuoDazi macOS ${APP_VERSION}"
          notes="免费体验调整为 5 分钟，更新内置桌宠资源库与默认设置。"
          asset="macos/dist/ZhuoDazi-macOS-${APP_VERSION}-${{ matrix.arch }}.zip"

          release_state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$release_state" == "false" ]]; then
            echo "Release $tag is already published; leaving it unchanged."
            exit 0
          fi

          if [[ -z "$release_state" ]]; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$title" --notes "$notes" || true
            release_state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          fi

          if [[ "$release_state" != "true" ]]; then
            echo "Unable to create or find draft release $tag." >&2
            exit 1
          fi

          gh release upload "$tag" "$asset" --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" --title "$title" --notes "$notes"
