name: Build macOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test macOS core logic
        run: swift test --package-path macos

      - name: Read application version
        run: echo "APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)" >> "$GITHUB_ENV"

      - name: Build ad-hoc signed application
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          ARCH_LABEL: ${{ matrix.arch }}
        run: bash macos/scripts/build-app.sh

      - name: Verify package architecture
        run: |
          file "macos/dist/ZhuoDazi-macOS-${APP_VERSION}-${{ matrix.arch }}.app/Contents/MacOS/ZhuoDazi"
          codesign --verify --deep --strict "macos/dist/ZhuoDazi-macOS-${APP_VERSION}-${{ matrix.arch }}.app"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: ZhuoDazi-macOS-${{ env.APP_VERSION }}-${{ matrix.arch }}
          path: macos/dist/ZhuoDazi-macOS-${{ env.APP_VERSION }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 3
